name: Keep backend alive

# Render's free tier spins the backend down after ~15 minutes with no
# requests, which wipes its local disk (database + uploaded posters) on
# the next restart. Pinging it every 5 minutes keeps it from ever going
# idle long enough to spin down.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf -m 20 https://masjid-e-ali-backend.onrender.com/api/health
